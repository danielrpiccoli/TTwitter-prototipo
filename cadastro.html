<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro | TTwitter</title>
    <meta name="description" content="Cria sua conta no TTwitter">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="auth-main">
        <img src="assets/logoTTwitter.png" alt="Logo TTwitter" class="logo">

        <section class="auth-card">
            <h1>Cadastro</h1>
            
            <form action="home.html" method="get">
                <div class="form-group">
                    <label for="nome">Nome</label>
                    <input type="text" id="nome" name="nome" placeholder="nome de usuário" required>
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="exemplo@email.com" required>
                </div>
                <div class="form-group">
                    <label for="data-de-nascimento">Data de nascimento</label>
                    <input type="date" id="data-de-nascimento" name="data-de-nascimento" placeholder="xx/xx/xxxx" required>
                </div>
                <div class="form-group">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" name="senha" placeholder="*********" required>
                </div>
                <div class="form-group">
                    <label for="confirmar-senha">Confirmar senha</label>
                    <input type="password" id="confirmar-senha" name="confirmar-senha" placeholder="*********" required>
                </div>
                <button type="submit" class="btn-primary">Cadastrar</button>
            </form>

            <p class="auth-switch"><a href="index.html">Fazer login</a></p>
            <p class="terms">Li e estou de acordo com os <a href="#">Termos</a> e <a href="#">Condições de uso</a>.</p>
        </section>
    </main>
</body>
</html>
