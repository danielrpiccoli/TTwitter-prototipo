<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home | TTwitter</title>
    <meta name="description" content="Veja as últimas postagens do TTwitter">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="home-header">
        <a href="home.html" class="logo" style="font-size:1.5rem;">TT</a>
        <form class="search-box" action="#" method="get">
            <input type="search" name="busca" placeholder=" Buscar">
        </form>
    </header>

    <div class="home-layout">
        <nav class="side-nav">
            <a href="home.html"></a>
            <a href="#"></a>
            <a href="#"></a>
            <a href="#"></a>
        </nav>

        <main class="feed">

            <section class="compose-box">
                <form action="#" method="post">
                    <textarea placeholder="No que está pensando...?"></textarea>
                    <div class="compose-actions">
                        <button type="submit" class="btn-primary">Postar</button>
                    </div>
                </form>
            </section>

            <article class="post">
                <div class="post-image">Imagem da postagem</div>
                <div class="post-body">
                    <div class="post-author">
                        <div class="avatar">U</div>
                        <spam>@usuario</spam>
                        <div class="post-actions"></div>
                    </div>
                    <p class="post-text">Lorem ipsim Lorem ipsum Lorem ipsum Lorem ipsum</p>
                </div>
            </article>
        </main>

        <aside class="suggestions">
            <h2>Pessoas que talvez você conheça</h2>
            <ul>
                <li><div class="avatar">U</div><span>@usuario</span><button class="btn-add">Adicionar</button></li>
                <li><div class="avatar">U</div><span>@usuario</span><button class="btn-add">Adicionar</button></li>
                <li><div class="avatar">U</div><span>@usuario</span><button class="btn-add">Adicionar</button></li>
                <li><div class="avatar">U</div><span>@usuario</span><button class="btn-add">Adicionar</button></li>
                
            </ul>
        </aside>
    </div>
</body>
</html>
