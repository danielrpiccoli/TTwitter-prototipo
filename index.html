<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | TTwitter</title>
    <meta name="description" content="Entre na sua conta do TTwitter">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="auth-main">

        <section class="auth-card">
            <h1>Bem vindo a plataforma TTwitter</h1>

            <form action="home.html" method="get">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="exemplo@email.com" required>
                </div>

                <div class="form-group">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" name="senha" placeholder="*********" required>
                </div>

                <a href="#" class="forgot-password">Esqueci minha senha</a>
                <button type="submit" class="btn-primary">Entrar</button>
            </form>

            <p class="auth-switch">Não tem conta? <a href="cadastro.html" class="btn-secondary">Registrar</a></p>
            <p class="terms">Li e estou de acordo com os <a href="#">Termos</a> e <a href="#">Condições de uso</a>.</p>
        </section>

         <img src="assets/logoTTwitter.png" alt="Logo TTwitter" class="logo" style="width: 280px;">

    </main>
</body>
</html>
